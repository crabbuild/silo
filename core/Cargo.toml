[package]
name = "silo-s3-core"
description = "AWS-independent immutable version-control ledger over S3-compatible object storage."
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["s3", "object-storage", "version-control", "prolly-tree"]
categories = ["database-implementations", "filesystem"]

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
bytes = "1.10"
data-encoding = "2.9"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.10"
minicbor = { version = "~2.3", features = ["std"] }
prolly = { package = "prolly-map", version = "0.7.0" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.45", features = ["rt", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.7"
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
