[package]
name = "silo-s3-client"
description = "AWS SDK-shaped client for the SILO immutable version-control ledger."
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["s3", "object-storage", "version-control", "prolly-tree"]
categories = ["database-implementations", "filesystem"]

[features]
default = ["foyer-cache"]
foyer-cache = ["dep:foyer"]
opentelemetry = ["dep:opentelemetry"]

[dependencies]
async-trait = "0.1"
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "=1.140.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-runtime-api = "1.9"
aws-smithy-types = { version = "1.3", features = ["http-body-1-x"] }
aws-types = "1.3"
futures-util = "0.3"
foyer = { version = "=0.22.3", default-features = false, features = ["runtime-tokio"], optional = true }
hmac = "0.12"
http-body = "1"
md-5 = "0.10"
hex = "0.4"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["metrics"], optional = true }
silo-s3-core = { path = "../core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
