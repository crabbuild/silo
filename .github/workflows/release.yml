name: SILO private release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: Validate and bundle private release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: silo-release-1.94.1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-features
      - run: cargo package --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: silo-crates-${{ github.sha }}
          path: target/package/*.crate
          if-no-files-found: error
      - name: Create private GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: target/package/*.crate
