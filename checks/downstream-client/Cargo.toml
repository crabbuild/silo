[package]
name = "silo-s3-downstream-client-check"
version = "0.0.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

[dependencies]
aws-sdk-s3 = { version = "=1.140.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
silo-s3-client = { path = "../../client", default-features = false }

[features]
foyer-cache = ["silo-s3-client/foyer-cache"]
